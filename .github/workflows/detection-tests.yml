name: Detection tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      # Replays every lab scenario through the rules on the Kusto emulator and posts the table to the run summary
      - run: |
          docker compose run --rm -T replay | tee replay.md
          status=${PIPESTATUS[0]}
          cat replay.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
