id: 595a9ae7-0e2a-4381-bf6b-c66923f2fd87
name: ITD-002 Account takeover sequence after credential reset
description: |
  Within 24 hours of an administrator resetting a user's password or MFA methods, the account signed
  in or registered a new MFA method from a network it had never signed in from (14-day history;
  IPv4 by address, IPv6 by /64). This is the social-engineering pattern: the attacker talks the
  service desk into a reset, then enrolls their own authenticator and signs in from their own
  infrastructure. The 24-hour watch outlasts a Temporary Access Pass, so waiting doesn't evade it.
  A ticket does not clear this alert. It proves the reset process ran, not that the caller was the
  real user, so ticket details are attached to help the analyst verify the request.
severity: High
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - SigninLogs
      - AuditLogs
  # ServiceNowTickets_CL is a custom table filled by ingestion/servicenow_to_sentinel.py
queryFrequency: 1h
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
  - DefenseEvasion
  - Persistence
relevantTechniques:
  - T1566.004
  - T1656
  - T1078.004
  - T1098.005
query: |
  let Frequency = 1h;    // same as queryFrequency
  let FollowOn = 24h;    // watch the account this long after a reset; keep >= the Temporary Access Pass max lifetime
  let CredentialResetOps = dynamic([
      "Reset password (by admin)", "Reset user password", "Reset password",
      "Admin registered security info", "Admin updated security info", "Admin deleted security info",
      "Create Temporary Access Pass method for user"]);
  let MfaRegistrationOps = dynamic(["User registered security info", "User changed default security info", "Add Passkey (device-bound)"]);
  // Devices rotate the host half of an IPv6 address daily, so compare IPv6 by /64 network
  let ToIpKey = (ip: string) { iff(ip contains ":", parse_ipv6_mask(ip, 64), ip) };
  let Resets = AuditLogs
      | where TimeGenerated > ago(1d + FollowOn)
      | where OperationName in~ (CredentialResetOps) and Result =~ "success"
      | extend Operator = tolower(tostring(InitiatedBy.user.userPrincipalName)),
               TargetUpn = tolower(tostring(TargetResources[0].userPrincipalName))
      | where isnotempty(Operator) and isnotempty(TargetUpn) and Operator != TargetUpn
      | project TargetUpn, Operator, ResetTime = TimeGenerated;
  // Judge each sign-in and MFA registration once, in the first run after it reaches the workspace,
  // so logs that arrive late are still checked
  let PostResetActivity = union
      (SigninLogs
          | where TimeGenerated > ago(1d) and ingestion_time() > ago(Frequency) and ResultType == "0"
          | project ActivityTime = TimeGenerated, TargetUpn = tolower(UserPrincipalName), IPAddress,
                    Activity = strcat("Sign-in to ", AppDisplayName), Country = tostring(LocationDetails.countryOrRegion)),
      (AuditLogs
          | where TimeGenerated > ago(1d) and ingestion_time() > ago(Frequency) and Result =~ "success"
          | where OperationName in~ (MfaRegistrationOps)
          | project ActivityTime = TimeGenerated, TargetUpn = tolower(tostring(InitiatedBy.user.userPrincipalName)),
                    IPAddress = tostring(InitiatedBy.user.ipAddress), Activity = OperationName, Country = "")
      | where isnotempty(IPAddress)
      | extend IpKey = ToIpKey(IPAddress);
  // Networks seen in earlier runs. Once an attacker network has alerted it becomes known,
  // so each new network alerts once per account instead of every hour.
  let KnownNetworks = SigninLogs
      | where TimeGenerated > ago(14d) and ingestion_time() <= ago(Frequency) and ResultType == "0"
      | summarize by TargetUpn = tolower(UserPrincipalName), IpKey = ToIpKey(IPAddress);
  let Takeovers = Resets
      | join kind=inner PostResetActivity on TargetUpn
      | where ActivityTime between (ResetTime .. (ResetTime + FollowOn))
      | join kind=leftanti KnownNetworks on TargetUpn, IpKey
      // report the latest reset the activity followed
      | summarize arg_max(ResetTime, Operator), FirstActivity = min(ActivityTime), Activities = make_set(Activity),
                  NewIps = make_set(IPAddress), Countries = make_set_if(Country, isnotempty(Country))
          by TargetUpn;
  let TicketContext = Takeovers
      | join kind=inner (ServiceNowTickets_CL | extend CallerUpn = tolower(CallerUpn), CreatedAt = todatetime(CreatedAt))
          on $left.TargetUpn == $right.CallerUpn
      | where CreatedAt between ((ResetTime - 2h) .. (ResetTime + 1h))
      | summarize TicketNumbers = make_set(TicketNumber), ContactTypes = make_set(ContactType) by TargetUpn;
  Takeovers
  | join kind=leftouter TicketContext on TargetUpn
  | project FirstActivity, TargetUpn, ResetTime, ResetBy = Operator, AttackerIp = tostring(NewIps[0]),
            NewIps = strcat_array(NewIps, ", "), Countries = strcat_array(Countries, ", "),
            Activities = strcat_array(Activities, ", "),
            TicketNumbers = iff(array_length(TicketNumbers) > 0, strcat_array(TicketNumbers, ", "), "none"),
            ContactTypes = strcat_array(ContactTypes, ", ")
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: TargetUpn
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: ResetBy
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: AttackerIp
customDetails:
  ResetTime: ResetTime
  NewIps: NewIps
  Countries: Countries
  Activities: Activities
  Tickets: TicketNumbers
  ContactTypes: ContactTypes
alertDetailsOverride:
  alertDisplayNameFormat: 'Possible takeover of {{TargetUpn}} after credential reset'
  alertDescriptionFormat: '{{ResetBy}} reset this account, then it was used from never-seen IP {{AttackerIp}}. Tickets: {{TicketNumbers}}.'
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
