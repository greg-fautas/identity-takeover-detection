id: a16d7066-d609-43e1-a972-3561be491399
name: ITD-003 Credential reset on a privileged account
description: |
  The password or MFA methods of an account on the PrivilegedAccounts watchlist were reset. Taking
  over one admin identity can hand an attacker the whole tenant, so every privileged reset gets
  reviewed, ticketed or not. Unlike the other rules, this one also counts self-service resets (the
  route after a SIM swap) and resets made by applications. Confirm the reset with the account owner
  through their manager or in person before closing.
severity: High
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - AuditLogs
queryFrequency: 1h
queryPeriod: 2h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Persistence
  - PrivilegeEscalation
relevantTechniques:
  - T1098
  - T1078.004
query: |
  let CredentialResetOps = dynamic([
      "Reset password (by admin)", "Reset user password", "Reset password", "Reset password (self-service)",
      "Admin registered security info", "Admin updated security info", "Admin deleted security info",
      "Create Temporary Access Pass method for user"]);
  // Watchlist alias PrivilegedAccounts, search key UserPrincipalName (see docs/lab.md)
  let PrivilegedAccounts = _GetWatchlist('PrivilegedAccounts') | project TargetUpn = tolower(tostring(SearchKey));
  AuditLogs
  // judge each event once, in the first run after it reaches the workspace
  | where TimeGenerated > ago(2h) and ingestion_time() > ago(1h)
  | where OperationName in~ (CredentialResetOps) and Result =~ "success"
  | extend TargetUpn = tolower(tostring(TargetResources[0].userPrincipalName))
  | where TargetUpn in (PrivilegedAccounts)
  // the initiator may be the user (self-service) or an application, not only an admin
  | extend Operator = tolower(coalesce(tostring(InitiatedBy.user.userPrincipalName), tostring(InitiatedBy.app.displayName))),
           OperatorIp = tostring(InitiatedBy.user.ipAddress)
  | summarize ResetTime = min(TimeGenerated), Operations = make_set(OperationName),
              OperatorIp = take_anyif(OperatorIp, isnotempty(OperatorIp))
      by TargetUpn, Operator, bin(TimeGenerated, 5m)
  | project ResetTime, TargetUpn, Operator, OperatorIp, Operations = strcat_array(Operations, ", ")
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: TargetUpn
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Operator
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: OperatorIp
customDetails:
  ResetTime: ResetTime
  Operations: Operations
alertDetailsOverride:
  alertDisplayNameFormat: 'Credential reset on privileged account {{TargetUpn}}'
  alertDescriptionFormat: '{{Operator}} reset credentials for privileged account {{TargetUpn}}. Confirm with the owner through their manager or in person.'
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
