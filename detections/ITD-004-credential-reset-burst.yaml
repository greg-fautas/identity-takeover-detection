id: acac4572-4b54-4719-9dfc-c0545668e926
name: ITD-004 Credential reset burst by a single operator
description: |
  One administrator reset the credentials of five or more different accounts in resets that reached
  the workspace within the same hour. This fits a compromised admin account being used to take over
  identities at scale, or to lock users out during an attack. An operator who paces resets under the
  threshold, or spreads them across several admin accounts, stays below it. Group this rule's alerts
  into incidents by operator; don't use alert suppression, which pauses the whole rule.
severity: Medium
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - AuditLogs
queryFrequency: 1h
queryPeriod: 2h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Impact
  - Persistence
  - PrivilegeEscalation
relevantTechniques:
  - T1531
  - T1098
query: |
  let Threshold = 5;   // distinct accounts reset by one operator per run
  let CredentialResetOps = dynamic([
      "Reset password (by admin)", "Reset user password", "Reset password",
      "Admin registered security info", "Admin updated security info", "Admin deleted security info",
      "Create Temporary Access Pass method for user"]);
  AuditLogs
  // judge each event once, in the first run after it reaches the workspace
  | where TimeGenerated > ago(2h) and ingestion_time() > ago(1h)
  | where OperationName in~ (CredentialResetOps) and Result =~ "success"
  | extend Operator = tolower(tostring(InitiatedBy.user.userPrincipalName)),
           OperatorIp = tostring(InitiatedBy.user.ipAddress),
           TargetUpn = tolower(tostring(TargetResources[0].userPrincipalName))
  | where isnotempty(Operator) and isnotempty(TargetUpn) and Operator != TargetUpn
  | summarize FirstReset = min(TimeGenerated), LastReset = max(TimeGenerated), AccountsReset = dcount(TargetUpn),
              Targets = make_set(TargetUpn, 50), OperatorIps = make_set_if(OperatorIp, isnotempty(OperatorIp))
      by Operator
  | where AccountsReset >= Threshold
  | project FirstReset, LastReset, Operator, AccountsReset, OperatorIp = tostring(OperatorIps[0]),
            Targets = strcat_array(Targets, ", ")
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Operator
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: OperatorIp
customDetails:
  AccountsReset: AccountsReset
  Targets: Targets
alertDetailsOverride:
  alertDisplayNameFormat: '{{Operator}} reset credentials on {{AccountsReset}} accounts in an hour'
  alertDescriptionFormat: '{{Operator}} reset credentials for {{AccountsReset}} different accounts within one hour: {{Targets}}'
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
