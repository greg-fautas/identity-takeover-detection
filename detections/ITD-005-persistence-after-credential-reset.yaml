id: 3724556f-b7fb-4c1a-b86c-1335c9280793
name: ITD-005 Persistence after credential reset
description: |
  Within 24 hours of an administrator resetting a user's credentials, the account consented to an
  OAuth application, registered a device, created or changed an inbox rule, or set mailbox
  forwarding. After a takeover, attackers use these to keep access once the password is changed
  back (app tokens, registered devices) and to hide or forward the victim's mail. Exchange audit
  events can reach the workspace an hour or more late, so each event is judged when it arrives
  rather than when it happened. Inbox rules and forwarding need the Microsoft 365 connector;
  without it the rule still runs on the Entra ID events.
severity: Medium
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - AuditLogs
  # Optional: the Office365 connector (OfficeActivity) adds inbox-rule coverage
queryFrequency: 1h
queryPeriod: 2d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Persistence
  - PrivilegeEscalation
  - DefenseEvasion
  - Collection
  - CredentialAccess
relevantTechniques:
  - T1098.005
  - T1564.008
  - T1114.003
  - T1528
query: |
  let Frequency = 1h;   // same as queryFrequency
  let CredentialResetOps = dynamic([
      "Reset password (by admin)", "Reset user password", "Reset password",
      "Admin registered security info", "Admin updated security info", "Admin deleted security info",
      "Create Temporary Access Pass method for user"]);
  let Resets = AuditLogs
      | where TimeGenerated > ago(2d)
      | where OperationName in~ (CredentialResetOps) and Result =~ "success"
      | extend Operator = tolower(tostring(InitiatedBy.user.userPrincipalName)),
               TargetUpn = tolower(tostring(TargetResources[0].userPrincipalName))
      | where isnotempty(Operator) and isnotempty(TargetUpn) and Operator != TargetUpn
      | project TargetUpn, Operator, ResetTime = TimeGenerated;
  // Judge each event once, in the first run after it reaches the workspace (Exchange events often land late).
  // isfuzzy keeps the rule running in workspaces without OfficeActivity.
  let Persistence = union isfuzzy=true
      (AuditLogs
          | where TimeGenerated > ago(1d) and ingestion_time() > ago(Frequency) and Result =~ "success"
          | where OperationName in~ ("Consent to application", "Register device", "Add registered owner to device")
          // the user is a target of device-ownership events and the initiator of consents
          | mv-expand Target = TargetResources
          | project ActivityTime = TimeGenerated,
                    TargetUpn = tolower(coalesce(tostring(Target.userPrincipalName), tostring(InitiatedBy.user.userPrincipalName))),
                    Activity = OperationName, Detail = tostring(TargetResources[0].displayName),
                    IPAddress = tostring(InitiatedBy.user.ipAddress)),
      (OfficeActivity
          | where TimeGenerated > ago(1d) and ingestion_time() > ago(Frequency)
          | where Operation in~ ("New-InboxRule", "Set-InboxRule", "UpdateInboxRules")
              or (Operation =~ "Set-Mailbox" and Parameters has_any ("ForwardingSmtpAddress", "ForwardingAddress"))
          // ClientIP can carry a port, e.g. 203.0.113.7:51234 or [2001:db8::1]:443
          | project ActivityTime = TimeGenerated, TargetUpn = tolower(UserId), Activity = Operation,
                    Detail = tostring(Parameters),
                    IPAddress = coalesce(extract(@"^\[([0-9a-fA-F:.]+)\]", 1, ClientIP),
                                         extract(@"^(\d{1,3}(\.\d{1,3}){3})(:\d+)?$", 1, ClientIP), ClientIP))
      | where isnotempty(TargetUpn);
  Persistence
  | join kind=inner Resets on TargetUpn
  | where ActivityTime between (ResetTime .. (ResetTime + 24h))
  // one alert per account per run, tied to the latest reset before the activity
  | summarize arg_max(ResetTime, Operator), FirstActivity = min(ActivityTime), Activities = make_set(Activity),
              Details = make_set(Detail, 10), IPs = make_set_if(IPAddress, isnotempty(IPAddress))
      by TargetUpn
  | project FirstActivity, TargetUpn, Activities = strcat_array(Activities, ", "), Details = strcat_array(Details, " | "),
            IPAddress = tostring(IPs[0]), ResetTime, ResetBy = Operator
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: TargetUpn
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: ResetBy
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
customDetails:
  Activities: Activities
  Details: Details
  ResetTime: ResetTime
alertDetailsOverride:
  alertDisplayNameFormat: 'Persistence by {{TargetUpn}} within 24h of a credential reset'
  alertDescriptionFormat: '{{TargetUpn}} did {{Activities}} within 24 hours of a credential reset by {{ResetBy}}.'
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
