id: d01d335c-91af-421b-bc7c-c214f0639a38
name: ITD-001 Credential reset with no ticket evidence
description: |
  An administrator reset another user's password or MFA methods, and no ServiceNow ticket for that
  user was created within two hours either side of the reset. Resets that skip the ticket process
  are how a compromised or insider admin account takes over other identities without a paper trail.
  Each reset is judged once its ticket window has closed and late tickets have had time to arrive,
  so alerts come 2.5 to 3.5 hours after the reset.
severity: Medium
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - AuditLogs
  # ServiceNowTickets_CL is a custom table filled by ingestion/servicenow_to_sentinel.py
queryFrequency: 1h
queryPeriod: 330m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
  - Persistence
  - PrivilegeEscalation
relevantTechniques:
  - T1078.004
  - T1098
query: |
  let TicketWindow = 2h;            // a ticket counts if it was created within 2h either side of the reset
  let Delay = TicketWindow + 30m;   // plus time for a late ticket to reach Sentinel
  let Window = 1h;                  // same as queryFrequency
  let CredentialResetOps = dynamic([
      "Reset password (by admin)", "Reset user password", "Reset password",
      "Admin registered security info", "Admin updated security info", "Admin deleted security info",
      "Create Temporary Access Pass method for user"]);
  let Resets = AuditLogs
      | where TimeGenerated between (ago(Delay + Window) .. ago(Delay))
      | where OperationName in~ (CredentialResetOps) and Result =~ "success"
      | extend Operator = tolower(tostring(InitiatedBy.user.userPrincipalName)),
               OperatorIp = tostring(InitiatedBy.user.ipAddress),
               TargetUpn = tolower(tostring(TargetResources[0].userPrincipalName))
      | where isnotempty(Operator) and isnotempty(TargetUpn) and Operator != TargetUpn
      // one admin action can write several events (directory + password reset service), so collapse them
      | summarize ResetTime = min(TimeGenerated), Operations = make_set(OperationName),
                  OperatorIp = take_anyif(OperatorIp, isnotempty(OperatorIp))
          by TargetUpn, Operator, bin(TimeGenerated, 5m);
  let Ticketed = Resets
      // CreatedAt is set by ServiceNow itself, so it can't be backdated like the editable opened_at field
      | join kind=inner (ServiceNowTickets_CL | extend CallerUpn = tolower(CallerUpn), CreatedAt = todatetime(CreatedAt))
          on $left.TargetUpn == $right.CallerUpn
      | where CreatedAt between ((ResetTime - TicketWindow) .. (ResetTime + TicketWindow))
      | distinct TargetUpn, ResetTime;
  Resets
  | join kind=leftanti Ticketed on TargetUpn, ResetTime
  | project ResetTime, TargetUpn, Operator, OperatorIp, Operations = strcat_array(Operations, ", ")
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: TargetUpn
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Operator
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: OperatorIp
customDetails:
  ResetTime: ResetTime
  Operations: Operations
alertDetailsOverride:
  alertDisplayNameFormat: 'Credential reset for {{TargetUpn}} with no ticket'
  alertDescriptionFormat: '{{Operator}} reset credentials for {{TargetUpn}}, and no ticket for that user was created within 2 hours of the reset.'
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
